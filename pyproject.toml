[project]
name = "reading-group"
version = "0.0.1"
description = "Find arXiv papers, summarise them with a local LLM and build a RAG knowledge base."
requires-python = ">=3.11"
dependencies = [
    "arxiv>=4.0.1",
    "beartype>=0.20.2",
    "feedparser>=6.0.11",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
]
